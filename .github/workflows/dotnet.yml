# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        required: true
      description:
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  create_release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
      asset_version: ${{ steps.release_metadata.outputs.asset_version }}
    steps:
    - uses: actions/checkout@v4
    - name: Prepare release metadata
      id: release_metadata
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "release_tag=latest" >> "$GITHUB_OUTPUT"
          echo "release_name=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "asset_version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<EOF"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "release_tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release ${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "asset_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<EOF"
            echo "${{ inputs.description }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi
    - name: Refresh latest release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ steps.release_metadata.outputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release delete "${{ steps.release_metadata.outputs.release_tag }}" --repo "${{ github.repository }}" --cleanup-tag --yes
        fi
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.release_metadata.outputs.release_tag }}" \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "${{ steps.release_metadata.outputs.release_name }}" \
          --notes "${{ steps.release_metadata.outputs.release_body }}"

  publish:
    runs-on: ${{ matrix.config.os }}
    needs: create_release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    strategy:
      matrix:
        config: 
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Publish
      run: dotnet publish Pack3r.Console --self-contained -c Release -o release_dir -r ${{ matrix.config.rid }}
    - name: Create Zip File
      run: 7z a -r pack3r-release.zip ./release_dir/*
    - name: Upload release asset
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        asset_name="pack3r-${{ needs.create_release.outputs.asset_version }}-${{ matrix.config.rid }}.zip"
        mv ./pack3r-release.zip "./$asset_name"
        gh release upload "${{ needs.create_release.outputs.release_tag }}" "./$asset_name" --repo "${{ github.repository }}" --clobber
